<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { margin: 0; background: #f7f8fa; color: #202124; font: 16px Arial, sans-serif; }
      main { box-sizing: border-box; max-width: 560px; margin: 9vh auto; padding: 32px; text-align: center; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px #0002; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { line-height: 1.5; color: #5f6368; }
      .languages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
      button { border: 0; border-radius: 8px; padding: 15px 8px; background: #1a73e8; color: white; font-size: 17px; cursor: pointer; }
      button:hover { background: #1967d2; }
      button:disabled { background: #9aa0a6; cursor: wait; }
      #status { min-height: 24px; margin-top: 20px; }
      #continue { display: inline-block; padding: 15px 22px; border-radius: 8px; background: #1a73e8; color: white; text-decoration: none; }
      #continue[hidden] { display: none; }
      @media (max-width: 500px) { main { margin: 24px 16px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>SANAS W2 Survey</h1>
      <p>Choose the language in which you would like to complete the survey.</p>
      <div class="languages">
        <button onclick="start('RU')">Русский</button>
        <button onclick="start('KK')">Қазақша</button>
        <button onclick="start('EN')">English</button>
      </div>
      <p id="status" aria-live="polite"></p>
      <a id="continue" target="_top" hidden></a>
    </main>
    <script>
      const messages = {
        RU: { loading: 'Готовим опрос…', ready: 'Опрос готов.', next: 'Перейти к опросу', error: 'Не удалось загрузить опрос. Попробуйте выбрать язык ещё раз.' },
        KK: { loading: 'Сауалнама дайындалуда…', ready: 'Сауалнама дайын.', next: 'Сауалнамаға өту', error: 'Сауалнама жүктелмеді. Тілді қайта таңдап көріңіз.' },
        EN: { loading: 'Preparing your survey…', ready: 'Your survey is ready.', next: 'Open survey', error: 'Could not load the survey. Please select your language again.' }
      };
      let pending = false;
      function start(language) {
        if (pending) return;
        pending = true;
        const text = messages[language];
        const link = document.getElementById('continue');
        link.hidden = true;
        link.removeAttribute('href');
        document.querySelectorAll('button').forEach(button => button.disabled = true);
        document.getElementById('status').textContent = text.loading;
        function failed() {
          pending = false;
          document.getElementById('status').textContent = text.error;
          document.querySelectorAll('button').forEach(button => button.disabled = false);
        }
        google.script.run
          .withSuccessHandler(form => {
            if (!form || !/^https:\/\/docs\.google\.com\/forms\/d\/e\/[A-Za-z0-9_-]+\/viewform$/.test(form.url)) {
              failed();
              return;
            }
            // Apps Script's sandbox requires a fresh user action for top navigation.
            link.href = form.url;
            link.textContent = text.next;
            link.hidden = false;
            document.getElementById('status').textContent = text.ready;
            link.focus();
          })
          .withFailureHandler(failed)
          .getRandomForm(language);
      }
    </script>
  </body>
</html>
