<?xml version="1.0" encoding="UTF-8"?>
<!-- Sanas hardware figure H4: data flow with derivable rates.
     Hand-authored SVG, grayscale-safe. Solid = Phase 1, dashed = Phase 2.
     All rates using f = 15 Hz are ASSUMED; f is TBD from the VL53L7CX datasheet.
     Caption: docs/hardware/system_architecture.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" font-family="Helvetica, Arial, sans-serif" fill="#000">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="490" fill="#fff"/>

  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold">Data flow — door APC path (Phase 1) with Phase-2 correction (dashed)</text>

  <!-- legend -->
  <line x1="600" y1="34" x2="628" y2="34" stroke="#000" stroke-width="1.5"/>
  <text x="634" y="38" font-size="9">Phase 1</text>
  <line x1="676" y1="34" x2="704" y2="34" stroke="#000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="710" y="38" font-size="9">Phase 2</text>

  <!-- sensor node chain -->
  <rect x="20" y="60" width="120" height="52" fill="#eee" stroke="#000"/>
  <text x="80" y="80" text-anchor="middle" font-size="11">VL53L7CX</text>
  <text x="80" y="96" text-anchor="middle" font-size="9">8×8 depth frame</text>
  <line x1="140" y1="86" x2="180" y2="86" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="160" y="78" text-anchor="middle" font-size="8">I²C</text>
  <rect x="180" y="60" width="120" height="52" fill="#eee" stroke="#000"/>
  <text x="240" y="80" text-anchor="middle" font-size="11">ESP32-S3</text>
  <text x="240" y="96" text-anchor="middle" font-size="9">frame + send</text>
  <line x1="300" y1="86" x2="360" y2="86" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="330" y="66" text-anchor="middle" font-size="8">CAN</text>
  <text x="330" y="78" text-anchor="middle" font-size="8">raw frames</text>
  <text x="80" y="124" font-size="9">(×2 door nodes)</text>

  <!-- link-budget arithmetic -->
  <rect x="12" y="132" width="340" height="78" fill="#f5f5f5" stroke="#999"/>
  <text x="20" y="146" font-size="9" font-weight="bold">Link budget per node (shown arithmetic):</text>
  <text x="20" y="160" font-size="9">64 zones × 2 B = 128 B/frame (+64 B status, optional)</text>
  <text x="20" y="174" font-size="9">f = 15 Hz (vendor-rated max, 8×8 — node_design.md)</text>
  <text x="20" y="188" font-size="9">at f = 15 Hz: 128 × 15 = 1,920 B/s ≈ 15.4 kbit/s</text>
  <text x="20" y="202" font-size="9">CAN framing ≈ ×2 → ≈31 kbit/s/node; 2 nodes ≈ 62 kbit/s</text>

  <!-- raw log note -->
  <text x="20" y="234" font-size="9">raw 8×8 frames retained on gateway:</text>
  <text x="20" y="248" font-size="9">licence-clean training data for own models</text>
  <text x="20" y="262" font-size="9">(PCDS is CC BY-NC-SA — log 2026-08-10)</text>
  <line x1="255" y1="230" x2="368" y2="110" stroke="#666" stroke-width="0.7"/>

  <!-- gateway fusion loop -->
  <rect x="360" y="52" width="300" height="330" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="510" y="72" text-anchor="middle" font-size="12" font-weight="bold">Gateway fusion loop</text>
  <rect x="372" y="84" width="276" height="30" fill="#eee" stroke="#000"/>
  <text x="510" y="103" text-anchor="middle" font-size="9">frame ingest + raw log (per door, per stop)</text>
  <line x1="510" y1="114" x2="510" y2="124" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="372" y="124" width="276" height="34" fill="#eee" stroke="#000"/>
  <text x="510" y="138" text-anchor="middle" font-size="10">virtual-line crossing detector</text>
  <text x="510" y="152" text-anchor="middle" font-size="8">(line inside vestibule — Finding C, log 2026-08-10)</text>
  <line x1="510" y1="158" x2="510" y2="168" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="372" y="168" width="276" height="26" fill="#eee" stroke="#000"/>
  <text x="510" y="185" text-anchor="middle" font-size="10">boarding / alighting events (B, A)</text>
  <line x1="510" y1="194" x2="510" y2="204" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="372" y="204" width="276" height="28" fill="#eee" stroke="#000"/>
  <text x="510" y="222" text-anchor="middle" font-size="10">cumulative count N_t = N_(t−1) + B − A</text>
  <line x1="510" y1="232" x2="510" y2="242" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="372" y="242" width="276" height="28" fill="#eee" stroke="#000"/>
  <text x="510" y="254" text-anchor="middle" font-size="9">occupancy level (denominator = cabin capacity,</text>
  <text x="510" y="266" text-anchor="middle" font-size="9">TBD — product decision, findings.md §8)</text>
  <line x1="510" y1="270" x2="510" y2="280" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="372" y="280" width="276" height="30" fill="#eee" stroke="#000"/>
  <text x="510" y="292" text-anchor="middle" font-size="9">uplink report {ts, N_t, level, door events}</text>
  <text x="510" y="304" text-anchor="middle" font-size="9">≈100 B (ASSUMED), per stop / 30 s (TBD)</text>

  <!-- GPS reset -->
  <rect x="688" y="110" width="110" height="40" fill="#fff" stroke="#000"/>
  <text x="743" y="126" text-anchor="middle" font-size="10">GPS</text>
  <text x="743" y="140" text-anchor="middle" font-size="8">terminus geofence</text>
  <polyline points="688,130 668,130 668,218 660,218" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="700" y="166" font-size="8">reset N_t := 0</text>

  <!-- Phase-2 branch -->
  <rect x="20" y="300" width="330" height="64" fill="#fff" stroke="#000" stroke-dasharray="5,4"/>
  <text x="185" y="320" text-anchor="middle" font-size="10">salon RGB camera (wide-angle, ×1) — dormant</text>
  <text x="185" y="336" text-anchor="middle" font-size="9">DINOv2 / ConvNeXt-Tiny + CORN ordinal head</text>
  <text x="185" y="352" text-anchor="middle" font-size="8">activates on municipal camera permission</text>
  <polyline points="350,332 366,332 366,256 372,256" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="252" y="290" font-size="8">ordinal drift correction</text>
  <line x1="330" y1="292" x2="364" y2="294" stroke="#666" stroke-width="0.7"/>

  <!-- backend chain -->
  <line x1="660" y1="295" x2="688" y2="295" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="688" y="275" width="110" height="40" fill="#fff" stroke="#000"/>
  <text x="743" y="299" text-anchor="middle" font-size="10">LTE network</text>
  <line x1="743" y1="315" x2="743" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="688" y="340" width="110" height="56" fill="#fff" stroke="#000"/>
  <text x="743" y="358" text-anchor="middle" font-size="10">Avtobys</text>
  <text x="743" y="372" text-anchor="middle" font-size="9">backend API</text>
  <text x="743" y="386" text-anchor="middle" font-size="8">(TBD, Innoforce)</text>
  <line x1="743" y1="396" x2="743" y2="420" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="688" y="420" width="110" height="40" fill="#fff" stroke="#000"/>
  <text x="743" y="437" text-anchor="middle" font-size="10">rider app</text>
  <text x="743" y="450" text-anchor="middle" font-size="8">crowding info</text>

  <!-- footer -->
  <text x="20" y="404" font-size="9" fill="#444">No Kalman / sensor fusion in MVP: counter is plain accumulate-and-reset (pivot entry, experiments/log.md 2026-08-10).</text>
  <text x="20" y="418" font-size="9" fill="#444">Counter drift bounds and reset anchoring: weak-label constraints, experiments/log.md 2026-08-10.</text>
  <text x="20" y="432" font-size="9" fill="#444">Bandwidth arithmetic uses the vendor-rated 15 Hz (8×8) rate; the 500 kbit/s CAN bitrate remains ASSUMED.</text>
</svg>
