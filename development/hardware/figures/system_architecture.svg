<?xml version="1.0" encoding="UTF-8"?>
<!-- Sanas hardware figure H1: per-bus system architecture.
     Hand-authored SVG, no toolchain dependency. Grayscale-safe line art.
     Solid = Phase 1 (MVP), dashed = Phase 2 (dormant).
     Caption and assumptions: docs/hardware/system_architecture.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif" fill="#000">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#fff"/>

  <text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold">Sanas — per-bus system architecture (door-mounted 3D APC)</text>

  <!-- legend -->
  <line x1="585" y1="40" x2="615" y2="40" stroke="#000" stroke-width="1.5"/>
  <text x="621" y="44" font-size="10">Phase 1 (MVP)</text>
  <line x1="585" y1="58" x2="615" y2="58" stroke="#000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="621" y="62" font-size="10">Phase 2 (dormant)</text>

  <!-- Door 1 node -->
  <rect x="20" y="70" width="228" height="92" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="134" y="86" text-anchor="middle" font-size="12" font-weight="bold">Door 1 sensor node — variant (b)</text>
  <rect x="32" y="98" width="96" height="52" fill="#eee" stroke="#000"/>
  <text x="80" y="118" text-anchor="middle" font-size="11">VL53L7CX</text>
  <text x="80" y="132" text-anchor="middle" font-size="9">8×8 ToF, face down</text>
  <rect x="152" y="98" width="84" height="52" fill="#eee" stroke="#000"/>
  <text x="194" y="118" text-anchor="middle" font-size="11">ESP32-S3</text>
  <text x="194" y="132" text-anchor="middle" font-size="9">node MCU</text>
  <line x1="128" y1="124" x2="152" y2="124" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="140" y="114" text-anchor="middle" font-size="9">I²C</text>

  <!-- Door 2 node -->
  <rect x="20" y="176" width="228" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="134" y="194" text-anchor="middle" font-size="12">Door 2 sensor node — identical</text>
  <text x="134" y="210" text-anchor="middle" font-size="9">(VL53L7CX + ESP32-S3)</text>

  <!-- Variant (a) note -->
  <rect x="20" y="236" width="228" height="64" fill="#fff" stroke="#000" stroke-dasharray="5,4"/>
  <text x="30" y="252" font-size="10">Variant (a): RealSense-class 3D depth</text>
  <text x="30" y="266" font-size="10">module per door instead of (b);</text>
  <text x="30" y="280" font-size="10">interface + power TBD (trade study)</text>

  <!-- CAN trunk -->
  <line x1="284" y1="100" x2="284" y2="214" stroke="#000" stroke-width="3"/>
  <line x1="248" y1="116" x2="284" y2="116" stroke="#000" stroke-width="1.5"/>
  <line x1="248" y1="198" x2="284" y2="198" stroke="#000" stroke-width="1.5"/>
  <line x1="284" y1="156" x2="340" y2="156" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="277" y="90" width="14" height="10" fill="#fff" stroke="#000"/>
  <text x="296" y="98" font-size="9">120 Ω (term.)</text>
  <rect x="277" y="214" width="14" height="10" fill="#fff" stroke="#000"/>
  <text x="296" y="232" font-size="9">120 Ω (term.)</text>
  <text x="268" y="157" text-anchor="middle" font-size="10" transform="rotate(-90 268 157)">CAN 2.0 (500 kbit/s ASSUMED)</text>

  <!-- Gateway -->
  <rect x="340" y="70" width="244" height="240" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="462" y="88" text-anchor="middle" font-size="12" font-weight="bold">Gateway — one per bus</text>
  <text x="462" y="102" text-anchor="middle" font-size="9">CPU-class SBC (findings.md §7)</text>
  <rect x="352" y="112" width="110" height="26" fill="#eee" stroke="#000"/>
  <text x="407" y="129" text-anchor="middle" font-size="10">CAN interface</text>
  <line x1="407" y1="138" x2="407" y2="148" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="352" y="148" width="220" height="40" fill="#eee" stroke="#000"/>
  <text x="462" y="163" text-anchor="middle" font-size="10">APC engine (geometric, CPU-bound)</text>
  <text x="462" y="177" text-anchor="middle" font-size="10">line crossing → B/A events → N_t</text>
  <line x1="462" y1="188" x2="462" y2="198" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="352" y="198" width="220" height="26" fill="#eee" stroke="#000"/>
  <text x="462" y="215" text-anchor="middle" font-size="10">terminus reset — GPS geofence (radius TBD)</text>
  <line x1="462" y1="224" x2="462" y2="234" stroke="#000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="352" y="234" width="220" height="30" fill="#fff" stroke="#000" stroke-dasharray="5,4"/>
  <text x="462" y="247" text-anchor="middle" font-size="10">Phase-2 ordinal drift corrector</text>
  <text x="462" y="259" text-anchor="middle" font-size="9">(DINOv2 / ConvNeXt-Tiny + CORN)</text>
  <line x1="462" y1="264" x2="462" y2="274" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="352" y="274" width="150" height="26" fill="#eee" stroke="#000"/>
  <text x="427" y="291" text-anchor="middle" font-size="10">LTE uplink (modem TBD)</text>

  <!-- GPS -->
  <rect x="492" y="30" width="88" height="26" fill="#fff" stroke="#000"/>
  <text x="536" y="47" text-anchor="middle" font-size="10">GPS receiver</text>
  <line x1="536" y1="56" x2="536" y2="70" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Phase-2 RGB camera -->
  <rect x="340" y="336" width="244" height="48" fill="#fff" stroke="#000" stroke-dasharray="5,4"/>
  <text x="462" y="352" text-anchor="middle" font-size="10">salon RGB camera ×1, wide-angle (TBD)</text>
  <text x="462" y="366" text-anchor="middle" font-size="9">Phase 2 — dormant until municipal</text>
  <text x="462" y="378" text-anchor="middle" font-size="9">camera permission</text>
  <line x1="462" y1="336" x2="462" y2="310" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- right chain -->
  <rect x="630" y="112" width="150" height="36" fill="#fff" stroke="#000"/>
  <text x="705" y="134" text-anchor="middle" font-size="11">LTE network</text>
  <rect x="630" y="182" width="150" height="48" fill="#fff" stroke="#000"/>
  <text x="705" y="200" text-anchor="middle" font-size="11">Avtobys backend</text>
  <text x="705" y="216" text-anchor="middle" font-size="9">(Innoforce) — API contract TBD</text>
  <rect x="630" y="264" width="150" height="36" fill="#fff" stroke="#000"/>
  <text x="705" y="286" text-anchor="middle" font-size="11">rider app (crowding info)</text>
  <line x1="705" y1="148" x2="705" y2="182" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="705" y1="230" x2="705" y2="264" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <polyline points="502,287 610,287 610,130 630,130" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- footer -->
  <text x="20" y="430" font-size="9" fill="#444">Solid = Phase 1 (MVP). Dashed = Phase 2, dormant. Trunk carries 24 V + GND + CAN_H/CAN_L (see wiring_schematic.svg).</text>
  <text x="20" y="444" font-size="9" fill="#444">Basis: cabin-wide depth rejected — 10% floor coverage, r = 0.184 (findings.md §5); door-APC pivot, experiments/log.md 2026-08-10.</text>
</svg>
