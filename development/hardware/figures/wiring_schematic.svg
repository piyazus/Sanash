<?xml version="1.0" encoding="UTF-8"?>
<!-- Sanas hardware figure H3: power and data wiring, 2-door bus.
     Hand-authored SVG, grayscale-safe. Only fixed ICs: VL53L7CX, ESP32-S3.
     All fuse ratings, converter currents, wire gauges, connector and
     transceiver part numbers are TBD (docs/trade_study.md).
     Caption: docs/hardware/wiring.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Helvetica, Arial, sans-serif" fill="#000">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#fff"/>

  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold">Power and data wiring — 24 V vehicle supply, CAN trunk (2-door bus)</text>

  <!-- supply -->
  <rect x="20" y="44" width="150" height="56" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="64" text-anchor="middle" font-size="11" font-weight="bold">Vehicle battery</text>
  <text x="95" y="80" text-anchor="middle" font-size="10">24 V DC nominal</text>
  <text x="95" y="93" text-anchor="middle" font-size="9">(ASSUMED — verify)</text>

  <!-- F1 on vertical feed -->
  <line x1="95" y1="100" x2="95" y2="114" stroke="#000" stroke-width="1.5"/>
  <rect x="87" y="114" width="16" height="20" fill="#fff" stroke="#000"/>
  <text x="80" y="128" text-anchor="end" font-size="9">F1 (TBD)</text>
  <line x1="95" y1="134" x2="95" y2="150" stroke="#000" stroke-width="1.5"/>

  <!-- input protection -->
  <rect x="30" y="150" width="130" height="56" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="168" text-anchor="middle" font-size="10">input protection:</text>
  <text x="95" y="182" text-anchor="middle" font-size="10">reverse-polarity + TVS</text>
  <text x="95" y="197" text-anchor="middle" font-size="9">(ISO 7637-2 — to verify)</text>

  <!-- 24 V rail -->
  <line x1="95" y1="206" x2="95" y2="520" stroke="#000" stroke-width="2.5"/>
  <text x="82" y="360" text-anchor="middle" font-size="9" transform="rotate(-90 82 360)">24 V distribution</text>

  <!-- ===== gateway branch ===== -->
  <line x1="95" y1="250" x2="130" y2="250" stroke="#000" stroke-width="1.5"/>
  <rect x="130" y="244" width="26" height="12" fill="#fff" stroke="#000"/>
  <text x="143" y="238" text-anchor="middle" font-size="9">F2 (TBD)</text>
  <line x1="156" y1="250" x2="180" y2="250" stroke="#000" stroke-width="1.5"/>
  <rect x="180" y="228" width="110" height="40" fill="#eee" stroke="#000"/>
  <text x="235" y="246" text-anchor="middle" font-size="10">buck 24→5 V</text>
  <text x="235" y="260" text-anchor="middle" font-size="9">current TBD</text>
  <line x1="290" y1="250" x2="320" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="320" y="180" width="200" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="420" y="200" text-anchor="middle" font-size="11" font-weight="bold">Gateway — one per bus</text>
  <text x="330" y="220" font-size="9">· SBC, CPU-class (board TBD)</text>
  <text x="330" y="236" font-size="9">· CAN transceiver (part TBD)</text>
  <text x="330" y="252" font-size="9">· GPS receiver + antenna</text>
  <text x="330" y="268" font-size="9">· LTE modem + antenna</text>
  <text x="330" y="284" font-size="9">· storage for raw frame log</text>
  <text x="330" y="300" font-size="9">· 12 V aux rail optional (TBD)</text>
  <line x1="520" y1="260" x2="740" y2="260" stroke="#000" stroke-width="1.5"/>

  <!-- Phase-2 RGB (dashed) -->
  <rect x="560" y="60" width="220" height="56" fill="#fff" stroke="#000" stroke-dasharray="5,4"/>
  <text x="670" y="82" text-anchor="middle" font-size="10">salon RGB camera — Phase 2 (dormant)</text>
  <text x="670" y="98" text-anchor="middle" font-size="9">USB3 / GMSL to gateway — TBD</text>
  <polyline points="560,88 420,88 420,180" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- ===== node 1 branch ===== -->
  <line x1="95" y1="390" x2="130" y2="390" stroke="#000" stroke-width="1.5"/>
  <rect x="130" y="384" width="26" height="12" fill="#fff" stroke="#000"/>
  <text x="143" y="378" text-anchor="middle" font-size="9">F3 (TBD)</text>
  <line x1="156" y1="390" x2="180" y2="390" stroke="#000" stroke-width="1.5"/>

  <rect x="180" y="360" width="340" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="378" text-anchor="middle" font-size="11" font-weight="bold">Door 1 node</text>
  <rect x="192" y="392" width="80" height="30" fill="#eee" stroke="#000"/>
  <text x="232" y="405" text-anchor="middle" font-size="9">buck 24→5 V</text>
  <text x="232" y="416" text-anchor="middle" font-size="8">(TBD)</text>
  <rect x="284" y="392" width="64" height="30" fill="#eee" stroke="#000"/>
  <text x="316" y="410" text-anchor="middle" font-size="9">LDO 3.3 V</text>
  <rect x="360" y="392" width="80" height="30" fill="#eee" stroke="#000"/>
  <text x="400" y="405" text-anchor="middle" font-size="9">ESP32-S3</text>
  <text x="400" y="416" text-anchor="middle" font-size="8">TWAI · I²C</text>
  <rect x="360" y="436" width="80" height="30" fill="#eee" stroke="#000"/>
  <text x="400" y="449" text-anchor="middle" font-size="9">VL53L7CX</text>
  <text x="400" y="460" text-anchor="middle" font-size="8">rails TBD</text>
  <rect x="244" y="436" width="96" height="30" fill="#eee" stroke="#000"/>
  <text x="292" y="449" text-anchor="middle" font-size="9">CAN transceiver</text>
  <text x="292" y="460" text-anchor="middle" font-size="8">(part TBD)</text>
  <line x1="272" y1="407" x2="284" y2="407" stroke="#000" stroke-width="1.2"/>
  <line x1="348" y1="407" x2="360" y2="407" stroke="#000" stroke-width="1.2"/>
  <line x1="400" y1="422" x2="400" y2="436" stroke="#000" stroke-width="1.2"/>
  <text x="412" y="432" font-size="8">I²C + INT/LPn</text>
  <polyline points="376,422 376,428 312,428 312,436" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="338" y="426" font-size="8">TWAI</text>
  <polyline points="292,466 292,472 740,472" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- ===== node 2 branch ===== -->
  <line x1="95" y1="520" x2="130" y2="520" stroke="#000" stroke-width="1.5"/>
  <rect x="130" y="514" width="26" height="12" fill="#fff" stroke="#000"/>
  <text x="143" y="508" text-anchor="middle" font-size="9">F4 (TBD)</text>
  <line x1="156" y1="520" x2="180" y2="520" stroke="#000" stroke-width="1.5"/>
  <rect x="180" y="496" width="340" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="514" text-anchor="middle" font-size="10">Door 2 node — identical to Door 1</text>
  <text x="350" y="530" text-anchor="middle" font-size="9">buck → LDO 3.3 V → ESP32-S3 + CAN xcvr + VL53L7CX</text>
  <line x1="520" y1="520" x2="740" y2="520" stroke="#000" stroke-width="1.5"/>

  <!-- ===== CAN trunk ===== -->
  <line x1="740" y1="240" x2="740" y2="540" stroke="#000" stroke-width="3"/>
  <rect x="733" y="230" width="14" height="10" fill="#fff" stroke="#000"/>
  <text x="756" y="239" font-size="8">120 Ω</text>
  <rect x="733" y="540" width="14" height="10" fill="#fff" stroke="#000"/>
  <text x="756" y="553" font-size="8">120 Ω</text>
  <text x="762" y="390" text-anchor="middle" font-size="9" transform="rotate(-90 762 390)">CAN trunk: CAN_H / CAN_L twisted pair + 24 V + GND</text>

  <!-- footer notes -->
  <text x="20" y="586" font-size="9" fill="#444">Wire gauges and fuse ratings TBD after power budget (docs/hardware/bom.md, docs/trade_study.md). Connectors: automotive-grade, locking, TBD.</text>
  <text x="20" y="600" font-size="9" fill="#444">Single-point chassis ground at gateway; GND conductor carried in the trunk as CAN reference. Named ICs (VL53L7CX, ESP32-S3) are the only fixed parts.</text>
</svg>
